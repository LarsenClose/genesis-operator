run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Use default linters plus errcheck (enabled by default)
  # This matches what golangci-lint runs by default
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    # Only run default checks, not shadow/unusedwrite which require more refactoring
    enable-all: false

issues:
  exclude-rules:
    # Test files have more flexibility
    - path: _test\.go
      linters:
        - errcheck
        - govet
