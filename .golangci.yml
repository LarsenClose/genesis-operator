version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: false
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-QF1003"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - govet
      - text: "Error return value of .*.Close.*is not checked"
        linters:
          - errcheck
