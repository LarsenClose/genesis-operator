# Codecov configuration
# Single source of truth (removed duplicate codecov.yml)

coverage:
  status:
    project:
      default:
        target: auto    # No regression from base branch
        threshold: 2%   # Allow 2% fluctuation
    patch:
      default:
        target: 50%     # New code should have reasonable coverage
        # Note: cfg(not(feature = "mock")) branches in ffi.rs are
        # structurally untestable (tests require the mock feature)

ignore:
  - "pkg/api/v1alpha1/zz_generated.deepcopy.go"  # Auto-generated by controller-gen
  - "cmd/operator/main.go"                        # Auto-generated by kubebuilder
  - "internal/kms/mock/**/*"                      # Test mocks, not production code

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  production-code:
    paths:
      - "!pkg/api/v1alpha1/"
      - "!cmd/operator/"
      - "!internal/kms/mock/"
  rust:
    paths:
      - "genesis-core/"
    carryforward: true
