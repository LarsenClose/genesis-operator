# Codecov configuration
# Excludes auto-generated code from coverage metrics

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%

ignore:
  - "pkg/api/v1alpha1/zz_generated.deepcopy.go"  # Auto-generated by controller-gen
  - "cmd/operator/main.go"                        # Auto-generated by kubebuilder
  - "internal/kms/mock/**/*"                      # Test mocks, not production code

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  production-code:
    paths:
      - "!pkg/api/v1alpha1/"
      - "!cmd/operator/"
      - "!internal/kms/mock/"
