language = "C"
include_guard = "GENESIS_CORE_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
include_version = true
cpp_compat = true

[export]
include = [
    "GenesisHandle",
    "GenesisResult",
    "CPublicArtifacts",
    "StateTag",
]

[fn]
# No prefix -- CGO doesn't understand visibility macros
# prefix = "GENESIS_API"

[defines]
"feature = pq" = "GENESIS_PQ"
"feature = mock" = "GENESIS_MOCK"

[enum]
rename_variants = "ScreamingSnakeCase"
