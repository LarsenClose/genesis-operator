[package]
name = "genesis-core"
version = "0.3.0"
edition = "2021"
description = "Cryptographic core for genesis-operator — typestate-enforced key material lifecycle"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Crypto
age = { version = "0.11", default-features = false, features = ["armor"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hkdf = "0.12"
sha2 = "0.10"

# PQ (RustCrypto FIPS 203/204, feature-gated)
ml-kem = { version = "0.3.0-rc.0", features = ["getrandom", "zeroize"], optional = true }
ml-dsa = { version = "0.1.0-rc", features = ["rand_core"], optional = true }
sha3 = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }

# KMS clients + HTTP
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AWS KMS SigV4 signing
aws-sigv4 = "1"
aws-credential-types = "1"

# K8s secret injection
base64 = "0.22"

# FFI
libc = "0.2"

# Error handling
thiserror = "2"

[dev-dependencies]
genesis-core = { path = ".", features = ["mock"] }
trybuild = "1.0"
tempfile = "3"

[features]
default = ["pq"]
mock = []
pq = ["ml-kem", "ml-dsa", "sha3", "chacha20poly1305", "getrandom"]
local-kms = []

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
