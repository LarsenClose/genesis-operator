apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "genesis-operator.fullname" . }}
  labels:
    {{- include "genesis-operator.labels" . | nindent 4 }}
rules:
  # GenesisBootstrap resources
  - apiGroups:
      - genesis.io
    resources:
      - genesisbootstraps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - genesis.io
    resources:
      - genesisbootstraps/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - genesis.io
    resources:
      - genesisbootstraps/finalizers
    verbs:
      - update
  # Secrets management
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Namespace access (for checking target namespaces)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
