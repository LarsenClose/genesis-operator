                    type: string
                  tpm:
                    description: TPM contains TPM 2.0 specific configuration
                    properties:
                      pcrSelection:
                        description: PCRSelection defines which PCRs to use for sealing
                        properties:
                          hash:
                            default: sha256
                            description: Hash is the hash algorithm (e.g., "sha256")
                            type: string
                          pcrs:
                            description: PCRs is the list of PCR indices to use
