              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GenesisBootstrapSpec defines the desired state of GenesisBootstrap
            properties:
              attestation:
                description: Attestation contains identity attestation requirements
                  (optional)
                properties:
                  awsIrsa:
                    description: AWSIRSA contains AWS IRSA specific configuration
                    properties:
                      roleArn:
                        description: RoleArn is the ARN of the IAM role to assume
                        type: string
                    required:
                    - roleArn
                    type: object
                  gcpWorkloadIdentity:
                    description: GCPWorkloadIdentity contains GCP Workload Identity
                      configuration
                    properties:
                      serviceAccount:
                        description: ServiceAccount is the GCP service account email
