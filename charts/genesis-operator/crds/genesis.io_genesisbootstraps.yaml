                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              keyMetadata:
                description: KeyMetadata contains non-sensitive metadata about the
                  key
                properties:
                  algorithm:
                    default: X25519
                    description: Algorithm is the encryption algorithm (e.g., "X25519")
                    type: string
                  createdAt:
                    description: CreatedAt is when the key was created
                    format: date-time
                    type: string
                  publicKey:
                    description: PublicKey is the age public key
                    type: string
                required:
                - publicKey
                type: object
              lastAttestation:
                description: LastAttestation contains information about the last successful
                  attestation
                properties:
                  identity:
                    description: Identity is the identity that was attested
                    type: string
                  provider:
                    description: Provider is the KMS provider used
                    type: string
                  time:
                    description: Time is when the attestation occurred
                    format: date-time
                    type: string
                required:
