name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    name: Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: genesis-core

      - name: Check formatting
        run: cd genesis-core && cargo fmt --check

      - name: Clippy
        run: cd genesis-core && cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cd genesis-core && cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit Rust dependencies
        run: cd genesis-core && cargo audit

      - name: Build release
        run: cd genesis-core && cargo build --release --features mock

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Rust coverage
        run: cd genesis-core && cargo tarpaulin --out xml --skip-clean

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v4
        with:
          files: genesis-core/cobertura.xml
          flags: rust
          fail_ci_if_error: false

      - name: Generate header
        run: |
          cargo install cbindgen
          cd genesis-core && cbindgen --config cbindgen.toml --output genesis_core.h

      - name: Stage Rust artifacts
        run: |
          mkdir -p rust-artifacts
          cp genesis-core/target/release/libgenesis_core.a rust-artifacts/
          cp genesis-core/genesis_core.h rust-artifacts/

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts
          path: rust-artifacts/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: rust-artifacts

      - name: Install Rust library
        run: |
          mkdir -p genesis-core/target/release
          cp rust-artifacts/libgenesis_core.a genesis-core/target/release/
          cp rust-artifacts/genesis_core.h internal/bridge/genesis_core.h

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install sops
        run: |
          SOPS_VERSION=3.9.4
          curl -Lo sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64
          chmod +x sops
          sudo mv sops /usr/local/bin/

      - name: Run tests
        run: CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out ./...

      - name: Generate filtered coverage (exclude generated code)
        run: |
          # Exclude auto-generated code from coverage reporting
          COVERAGE_PACKAGES=$(go list ./... | grep -v -E "(pkg/api/v1alpha1|cmd/operator|internal/kms/mock)$")
          CGO_ENABLED=1 go test $COVERAGE_PACKAGES -coverprofile=coverage-filtered.out
          echo "### Coverage Report (Production Code Only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage-filtered.out | tail -1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Excludes: pkg/api/v1alpha1 (generated), cmd/operator (generated), internal/kms/mock (test mock)" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-filtered.out
          fail_ci_if_error: false
          flags: production-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: rust-artifacts

      - name: Install Rust library
        run: |
          mkdir -p genesis-core/target/release
          cp rust-artifacts/libgenesis_core.a genesis-core/target/release/
          cp rust-artifacts/genesis_core.h internal/bridge/genesis_core.h

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        env:
          CGO_ENABLED: "1"

      - name: Check key material containment
        run: make check-key-material

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: rust-artifacts

      - name: Install Rust library
        run: |
          mkdir -p genesis-core/target/release
          cp rust-artifacts/libgenesis_core.a genesis-core/target/release/
          cp rust-artifacts/genesis_core.h internal/bridge/genesis_core.h

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build CLI
        run: CGO_ENABLED=1 go build -v ./cmd/genesis

      - name: Build Operator
        run: CGO_ENABLED=1 go build -v ./cmd/operator

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: rust-artifacts

      - name: Install Rust library
        run: |
          mkdir -p genesis-core/target/release
          cp rust-artifacts/libgenesis_core.a genesis-core/target/release/
          cp rust-artifacts/genesis_core.h internal/bridge/genesis_core.h

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          CGO_ENABLED=1 govulncheck ./...

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          CGO_ENABLED=1 gosec -exclude-generated ./...

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint charts/genesis-operator

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: genesis-operator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: genesis-operator:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'genesis-operator:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: genesis-test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        run: |
          docker build -t genesis-operator:test .
          kind load docker-image genesis-operator:test --name genesis-test

      - name: Install CRDs
        run: |
          kubectl apply -f config/crd/bases/ || true

      - name: Run E2E tests
        run: |
          go test ./test/e2e/... -v -tags=e2e -timeout 10m
