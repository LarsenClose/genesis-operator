version: 2

project_name: genesis-operator

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: genesis
    main: ./cmd/genesis
    binary: genesis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: disentangle-network
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/LarsenClose/genesis-operator
    description: "GitOps secrets bootstrap operator for Kubernetes"
    license: Apache-2.0
    skip_upload: auto
    install: |
      bin.install "genesis"
    test: |
      system "#{bin}/genesis", "version"
