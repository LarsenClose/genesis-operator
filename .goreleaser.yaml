version: 2

project_name: genesis-operator

before:
  hooks:
    - go mod tidy

builds:
  - id: genesis
    main: ./cmd/genesis
    binary: genesis
    env:
      - CGO_ENABLED=1
    # Linux/amd64 only -- Rust static library is pre-built on the CI runner.
    # Cross-platform binaries require cargo-zigbuild and can be added later.
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
